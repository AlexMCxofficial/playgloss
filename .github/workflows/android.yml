name: Build Android APK

# Manual only: Actions tab > Build Android APK > Run workflow.
# When it finishes, open the run page and download the zip under "Artifacts"
# (PlayGloss-android). The APK is unsigned; sign it before publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      # Fix: the action's default package list contains the obsolete 'tools'
      # package, which no longer exists in recent cmdline-tools and makes
      # sdkmanager fail. An empty list skips it; we install what we need below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - run: npm install

      - name: Initialize Tauri Android project if needed
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi

      # The QR scanner in Online > Join a game needs the camera. The camera is only used after the player presses
      # "Scan QR code", and it is optional (devices without a camera can still install the app).
      - name: Allow the camera for QR scanning
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.CAMERA" "$M"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-feature android:name="android.hardware.camera" android:required="false" \/>\n    <application/' "$M"
          fi
          grep -n "CAMERA\|hardware.camera" "$M"

      - run: npx tauri android build --apk

      - name: Collect APKs
        shell: bash
        run: |
          mkdir dist
          find src-tauri/gen/android -path "*/outputs/apk/*" -name "*.apk" -exec cp {} dist/ \;
          ls -l dist
          test -n "$(ls -A dist)"

      - uses: actions/upload-artifact@v4
        with:
          name: PlayGloss-android
          path: dist/*
          if-no-files-found: error
          retention-days: 30
