name: Build Android app

# Manual only: Actions tab > Build Android app > Run workflow.
# When it finishes, open the run page and download the zip under "Artifacts"
# (PlayGloss-apk). Upload the .apk inside it to your release yourself.
#
# Signing:
# - If the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and
#   ANDROID_KEY_ALIAS exist, the APK is signed with your real release key.
# - If they are missing, the APK is signed with a throwaway key so it still installs.
#   Do NOT publish that one: phones will refuse to update it to a properly signed build later.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - name: Set up Android build
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          npx tauri android init --ci

      - name: Build release APK (arm64 and 32-bit ARM phones)
        run: npx tauri android build --apk --target aarch64 armv7

      - name: Sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find src-tauri/gen/android -name "*-unsigned.apk" | head -1)
          test -n "$UNSIGNED"
          echo "Signing $UNSIGNED"

          if [ -n "$KEYSTORE_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Using your release key."
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Signing secrets not found. Using a throwaway test key. Do not publish this APK."
            KS_PASS=testpass123
            KEY_ALIAS=test
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=PlayGloss test"
          fi

          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --out PlayGloss.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify PlayGloss.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PlayGloss-apk
          path: PlayGloss.apk
          if-no-files-found: error
          retention-days: 30
