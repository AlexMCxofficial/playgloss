name: Build Android APK

# Manual only: Actions tab > Build Android APK > Run workflow.
# When it finishes, download the SIGNED APK from "Artifacts" (PlayGloss-android).
# It runs on all ARM and Intel phones.
#
# One-time setup (Settings > Secrets and variables > Actions > New repository secret):
#   ANDROID_KEYSTORE_BASE64    the keystore file as one line:  base64 -w0 release.jks
#   ANDROID_KEYSTORE_PASSWORD  the keystore password
#   ANDROID_KEY_ALIAS          the key alias inside the keystore
#   ANDROID_KEY_PASSWORD       (optional) only if the key has a different password than the keystore
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android
  cancel-in-progress: true

env:
  BUILD_TOOLS: 34.0.0
  NDK: 27.0.12077973

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Stop in the first seconds if a signing secret is missing.
      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for v in KS PW AL; do
            if [ -z "${!v}" ]; then
              echo "::error::A signing secret is missing (see the setup note at the top of .github/workflows/android.yml)"
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check release version
        run: node tools/check-release-version.js

      - name: Set APK version
        run: echo "VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      # The game's own checks. A broken build never reaches a phone.
      - name: Run the game tests
        run: |
          for t in tests/*.js; do
            echo "== $t"
            node "$t"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # All four targets: ARM 64/32-bit and Intel 64/32-bit (the universal APK).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      # The action's default package list contains the obsolete 'tools' package, which makes sdkmanager fail.
      # An empty list skips it; we install what we need below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;${BUILD_TOOLS}" "ndk;${NDK}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK}" >> "$GITHUB_ENV"

      - name: Install the Tauri tools
        run: npm ci

      - name: Initialize Tauri Android project if needed
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi

      - name: Install PlayGloss launcher icons
        run: cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      # The QR scanner in Online > Join a game needs the camera. The camera is only used after the player presses
      # "Scan QR code", and it is optional (devices without a camera can still install the app).
      - name: Allow the camera for QR scanning
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.CAMERA" "$M"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-feature android:name="android.hardware.camera" android:required="false" \/>\n    <application/' "$M"
          fi
          grep -n "CAMERA\|hardware.camera" "$M"

      # Build one universal APK for all phone types.
      - name: Build the universal APK
        run: npx tauri android build --apk --ci

      # zipalign first, then apksigner (changing a file after signing would break the signature).
      - name: Align, sign and verify the APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          KS="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KS"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          mkdir dist
          APK=$(find src-tauri/gen/android -path "*/outputs/apk/*" -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::The build made no APK"
            exit 1
          fi
          OUT="dist/PlayGloss-${VERSION}.apk"
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$OUT" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | grep -i "SHA-256 digest" || true
          "$BT/apksigner" verify "$OUT"
          rm -f "$RUNNER_TEMP/aligned.apk" "$OUT.idsig"
          ls -lh "$OUT"
          sha256sum "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PlayGloss-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
