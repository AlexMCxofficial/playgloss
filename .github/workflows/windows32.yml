name: Build Windows 32-bit app

# Manual only: Actions tab > Build Windows 32-bit app > Run workflow.
# When it finishes, open the run page and download the zip under "Artifacts"
# (PlayGloss-windows-32bit). Upload the .exe inside it to your release yourself.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check release version
        run: node tools/check-release-version.js

      - name: Run the tests
        shell: bash
        run: |
          for t in tests/*.js; do
            echo "== $t"
            node "$t"
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-32bit

      - run: npm ci

      - name: Test 32-bit native code
        run: cargo test --locked --lib --target i686-pc-windows-msvc --manifest-path src-tauri/Cargo.toml

      - run: npx tauri build --bundles nsis --target i686-pc-windows-msvc

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION=$(node -p 'require("./package.json").version')
          installers=(src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe)
          if (( ${#installers[@]} != 1 )); then
            echo "::error::Expected one 32-bit NSIS installer, found ${#installers[@]}"
            exit 1
          fi
          mkdir dist
          cp "${installers[0]}" "dist/PlayGloss_${VERSION}_Windows10_32bit-setup.exe"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: PlayGloss-windows-32bit
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
